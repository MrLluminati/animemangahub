name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -----------------------------------------------------------------------
  # Lint and type-check on every PR and push
  # -----------------------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Type check frontend
        working-directory: frontend
        run: npm run type-check

      - name: Type check backend
        working-directory: backend
        run: npm run type-check

  # -----------------------------------------------------------------------
  # Deployment is intentionally disabled for now.
  #
  # Future Vercel deployment secrets:
  # - VERCEL_TOKEN
  # - VERCEL_ORG_ID
  # - VERCEL_PROJECT_ID
  #
  # Future Railway deployment secret:
  # - RAILWAY_TOKEN
  #
  # Re-enable these jobs only after hosting is configured.
  # -----------------------------------------------------------------------

  deploy-frontend:
    name: Deploy Frontend - Vercel disabled
    needs: lint
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Deployment deferred
        run: echo "Vercel deployment is disabled until hosting secrets are configured."

  deploy-backend:
    name: Deploy Backend - Railway disabled
    needs: lint
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Deployment deferred
        run: echo "Railway deployment is disabled until hosting secrets are configured."
